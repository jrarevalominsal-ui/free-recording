<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaking Activity: Saying / Reflection (Present, Past & Future)</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f4f8;
            color: #1e293b;
            margin: 0;
            padding: 20px;
            line-height: 1.55;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
        }
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 10px;
        }
        h1 { color: #5b21b6; margin: 0 0 4px 0; }
        .subtitle { color: #64748b; margin: 0 0 20px 0; }
        .btn-script {
            background: #e2e8f0;
            color: #1e293b;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.88em;
            cursor: pointer;
        }
        .btn-script:hover { background: #cbd5e1; }
        .script-drawer {
            display: none;
            background: #0f172a;
            color: #e2e8f0;
            border-radius: 10px;
            padding: 18px;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .script-drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 10px;
        }
        .script-drawer-title {
            font-weight: 700;
            font-size: 0.95em;
            color: #f8fafc;
        }
        .btn-copy-script {
            background: #0d9488;
            color: #ffffff;
            border: none;
            padding: 7px 13px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85em;
            cursor: pointer;
        }
        .btn-close-script {
            background: #475569;
            color: #ffffff;
            border: none;
            padding: 7px 12px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85em;
            cursor: pointer;
        }
        pre.script-code {
            margin: 0;
            padding: 14px;
            background: #020617;
            color: #a5f3fc;
            border-radius: 8px;
            overflow-x: auto;
            font-family: Consolas, Monaco, 'Courier New', monospace;
            font-size: 0.84em;
            line-height: 1.45;
        }
        .student-grid {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(210px, 1fr));
            gap: 14px;
        }
        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .field-group label {
            font-size: 0.9em;
            font-weight: 700;
            color: #334155;
        }
        .field-group input {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95em;
            background: #ffffff;
        }
        .topic-card {
            background: #f5f3ff;
            border-left: 5px solid #6d28d9;
            padding: 18px;
            border-radius: 0 10px 10px 0;
            margin-bottom: 20px;
        }
        .structure-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .step-box {
            background: #ffffff;
            border: 1px solid #c4b5fd;
            border-radius: 8px;
            padding: 12px;
            font-size: 0.92em;
        }
        .step-tag {
            display: inline-block;
            background: #6d28d9;
            color: white;
            font-size: 0.78em;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 12px;
            margin-bottom: 6px;
        }
        .card {
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 18px;
            margin: 16px 0;
            background: #f8fafc;
        }
        .timer-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            padding: 12px 16px;
            border-radius: 8px;
            margin-bottom: 14px;
        }
        .timer-display {
            font-size: 1.4em;
            font-weight: 800;
            font-family: monospace;
            color: #0f172a;
        }
        .timer-goal {
            font-size: 0.9em;
            color: #475569;
        }
        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            margin-bottom: 12px;
        }
        button.action-btn {
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            font-size: 0.95em;
            transition: opacity 0.2s, transform 0.1s;
        }
        button.action-btn:active { transform: scale(0.98); }
        button:disabled { opacity: 0.45; cursor: not-allowed; }
        .btn-rec { background: #dc2626; color: white; }
        .btn-stop { background: #d97706; color: white; }
        .btn-submit {
            background: #6d28d9;
            color: white;
            padding: 15px 24px;
            font-size: 1.05em;
            width: 100%;
            margin-top: 16px;
        }

        .confirm-prompt {
            display: none;
            margin-top: 16px;
            padding: 18px;
            border-radius: 10px;
            background: #fefce8;
            border: 2px solid #eab308;
        }
        .confirm-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 12px;
        }
        .btn-eval-only {
            background: #0d9488;
            color: white;
            flex: 1;
            min-width: 220px;
        }
        .btn-eval-send {
            background: #5b21b6;
            color: white;
            flex: 1;
            min-width: 220px;
        }
        .btn-cancel {
            background: #64748b;
            color: white;
        }

        .live-status { font-size: 0.92em; font-weight: bold; color: #475569; }
        .recording-active { color: #dc2626; }
        .transcript-box {
            background: #ffffff;
            border: 1px dashed #cbd5e1;
            border-radius: 8px;
            padding: 14px;
            min-height: 85px;
            font-size: 1.02em;
            color: #0f172a;
        }
        .audio-preview {
            margin-top: 12px;
            display: none;
        }
        .audio-preview audio {
            width: 100%;
        }
        .word-ok { color: #15803d; font-weight: 600; background: #dcfce7; padding: 1px 4px; border-radius: 4px; }
        .word-miss { color: #b91c1c; font-weight: 600; background: #fee2e2; padding: 1px 4px; border-radius: 4px; text-decoration: underline; }

        .final-summary {
            margin-top: 24px;
            padding: 24px;
            border-radius: 12px;
            background: #f0fdf4;
            border: 2px solid #16a34a;
            display: none;
        }
        .grade-banner {
            background: #ffffff;
            border: 2px solid #6d28d9;
            border-radius: 10px;
            padding: 16px;
            text-align: center;
            margin-bottom: 16px;
        }
        .grade-number {
            font-size: 2.5em;
            font-weight: 800;
            color: #6d28d9;
            line-height: 1.1;
        }
        .rubric-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(195px, 1fr));
            gap: 10px;
            margin-bottom: 16px;
        }
        .rubric-item {
            background: #ffffff;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #bbf7d0;
        }
        .correction-box {
            background: #ffffff;
            border: 1px solid #bbf7d0;
            border-radius: 8px;
            padding: 16px;
            margin-top: 12px;
        }
        .issue-item {
            background: #fef2f2;
            border-left: 4px solid #dc2626;
            padding: 10px 12px;
            margin: 8px 0;
            border-radius: 0 6px 6px 0;
            color: #7f1d1d;
        }
        .ok-item {
            background: #f0fdf4;
            border-left: 4px solid #16a34a;
            padding: 10px 12px;
            margin: 8px 0;
            border-radius: 0 6px 6px 0;
            color: #14532d;
        }
        .send-status {
            margin-top: 12px;
            padding: 10px 14px;
            border-radius: 8px;
            font-size: 0.94em;
            font-weight: 600;
            background: #eff6ff;
            color: #1e3a8a;
